<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Track — Black Belt study log</title>
<meta name="description" content="Study tracker for the SSDSI Lean Six Sigma Black Belt Fast Track. Unit mastery scored from debriefs, deadline countdown, session history plotted as an individuals control chart.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E9ECE6'/%3E%3Cpath d='M3 22 L10 14 L16 19 L22 8 L29 12' fill='none' stroke='%2321262A' stroke-width='2.5'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   TOKENS — every colour, space and size comes from here.
   ========================================================================== */
:root{
  --paper:    #E9ECE6;
  --panel:    #E1E6DF;
  --graphite: #21262A;
  --muted:    #5C6560;
  --rule:     #B4C4BB;
  --spec:     #A6301F;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
  --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;

  --display:'Space Grotesk', system-ui, sans-serif;
  --body:'IBM Plex Sans', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;

  --t-xs:12px; --t-sm:14px; --t-base:17px; --t-lg:21px; --t-xl:27px;
  --maxw:1080px;
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--paper);
  background-image:
    linear-gradient(to right, rgba(180,196,187,.30) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(180,196,187,.30) 1px, transparent 1px);
  background-size:24px 24px;
  color:var(--graphite);
  font-family:var(--body);
  font-size:var(--t-base);
  line-height:1.6;
}
.wrap{ max-width:var(--maxw); margin:0 auto; padding:var(--s6) var(--s4) var(--s9); }

/* --- masthead ----------------------------------------------------------- */
.mast{
  border-bottom:2px solid var(--graphite);
  padding-bottom:var(--s4); margin-bottom:var(--s6);
  display:flex; flex-wrap:wrap; align-items:baseline;
  justify-content:space-between; gap:var(--s3);
}
.mast h1{ font-family:var(--display); font-size:var(--t-xl); line-height:1.1; letter-spacing:-.02em; margin:0; }
.mast .sub{ font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.10em;
  text-transform:uppercase; color:var(--muted); margin:var(--s1) 0 0; }
.mast .count{ font-family:var(--mono); font-size:var(--t-sm); color:var(--muted); }
.mast .navlink{ color:var(--muted); text-decoration:none;
  border-bottom:1px solid var(--rule); padding-bottom:2px; }
.mast .navlink:hover{ color:var(--graphite); border-color:var(--graphite); }
.mast .navlink:focus-visible{ outline:2px solid var(--graphite); outline-offset:3px; }

/* --- headline readout --------------------------------------------------- */
.readout{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:var(--s5); margin-bottom:var(--s6); }
.figure .n{ font-family:var(--display); font-size:clamp(40px,9vw,64px); line-height:1;
  letter-spacing:-.03em; display:block; font-variant-numeric:tabular-nums; }
.figure .n small{ color:var(--muted); font-size:.5em; letter-spacing:0; }
.figure .cap{ font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.10em;
  text-transform:uppercase; color:var(--muted); margin-top:var(--s2); display:block; }
.figure.urgent .n{ color:var(--spec); }
.flag{ font-family:var(--mono); font-size:var(--t-xs); color:var(--spec);
  border:1px solid var(--spec); padding:1px var(--s2); display:inline-block; margin-top:var(--s2); }

/* --- sections ----------------------------------------------------------- */
section{ margin-bottom:var(--s7); }
h2{ font-family:var(--mono); font-size:var(--t-xs); font-weight:500; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--rule);
  padding-bottom:var(--s2); margin:0 0 var(--s4); }
p{ max-width:65ch; }
.note{ font-size:var(--t-sm); color:var(--muted); }

/* --- tollgates ---------------------------------------------------------- */
.gates{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:var(--s3); }
.gate{ border:1px solid var(--rule); padding:var(--s4); background:var(--paper); }
.gate.active{ border-color:var(--graphite); border-width:2px; background:var(--panel); }
.gate.done{ border-color:var(--graphite); }
.gate .step{ font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.10em;
  text-transform:uppercase; color:var(--muted); }
.gate h3{ font-family:var(--display); font-size:var(--t-lg); margin:var(--s2) 0; letter-spacing:-.01em; }
.gate p{ margin:0; font-size:var(--t-sm); color:var(--muted); }
.gate .state{ font-family:var(--mono); font-size:var(--t-xs); margin-top:var(--s3);
  display:block; letter-spacing:.06em; }
.gate.todo .state{ color:var(--muted); }
.gate.active .state{ color:var(--graphite); }
.gate.done .state{ color:var(--graphite); }

/* --- next block --------------------------------------------------------- */
.nextup{ background:var(--panel); border-left:3px solid var(--graphite); padding:var(--s4) var(--s5); }
.nextup p{ margin:0 0 var(--s3); }
.chips{ display:flex; flex-wrap:wrap; gap:var(--s2); list-style:none; padding:0; margin:0; }
.chip{ font-family:var(--mono); font-size:var(--t-sm); border:1px solid var(--graphite);
  padding:var(--s1) var(--s2); background:var(--paper); }
.chip.due{ border-color:var(--spec); color:var(--spec); }

/* --- control chart ------------------------------------------------------ */
.chart-frame{ background:var(--panel); padding:var(--s5) var(--s4) var(--s4); }
.chart-frame svg{ display:block; width:100%; height:auto; }
.chart-legend{ font-family:var(--mono); font-size:var(--t-xs); color:var(--muted);
  margin:var(--s3) 0 0; max-width:70ch; }
.chart-legend strong{ color:var(--graphite); font-weight:500; }

/* --- units -------------------------------------------------------------- */
details.block{ border-bottom:1px solid var(--rule); }
details.block:first-of-type{ border-top:1px solid var(--rule); }
summary.block-head{ cursor:pointer; padding:var(--s4) var(--s2); display:grid;
  grid-template-columns:auto 1fr auto; align-items:center; gap:var(--s4);
  list-style:none; min-height:44px; }
summary.block-head::-webkit-details-marker{ display:none; }
summary.block-head:hover{ background:var(--panel); }
summary.block-head:focus-visible{ outline:2px solid var(--graphite); outline-offset:-2px; }
.block-name{ font-family:var(--display); font-size:var(--t-lg); letter-spacing:-.01em; }
.block-sub{ font-family:var(--mono); font-size:var(--t-xs); color:var(--muted);
  display:block; letter-spacing:.08em; }
.block-tally{ font-family:var(--mono); font-size:var(--t-sm);
  font-variant-numeric:tabular-nums; white-space:nowrap; }

.dist{ display:flex; height:10px; width:100%; min-width:60px; background:var(--rule); }
.dist span{ display:block; height:100%; }
.dist .l3{ background:var(--graphite); }
.dist .l2{ background:rgba(33,38,42,.55); }
.dist .l1{ background:rgba(33,38,42,.22); }

.units{ list-style:none; margin:0 0 var(--s4); padding:0; }
.unit{ display:grid; grid-template-columns:76px 1fr auto; gap:var(--s3); align-items:center;
  padding:var(--s2); border-top:1px solid rgba(180,196,187,.5); font-size:var(--t-sm); }
.unit .uid{ font-family:var(--mono); color:var(--muted); font-size:var(--t-xs); }
.unit.done .uname{ color:var(--muted); }
.unit .tag{ font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); border:1px solid var(--rule);
  padding:0 4px; margin-left:var(--s2); white-space:nowrap; }
.unit .tag.proj{ border-color:var(--graphite); color:var(--graphite); }
.unit-alt{
  grid-column: 2 / -1;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .04em;
  margin-top: 2px;
}
.unit-flag{
  grid-column: 2 / -1;
  font-size: var(--t-xs);
  color: var(--spec);
  font-style: italic;
  margin-top: 2px;
}
.pips{ display:flex; gap:3px; align-items:center; }
.pips i{ width:11px; height:11px; border:1px solid var(--graphite); display:block; }
.pips i.on{ background:var(--graphite); }
.pips .sr{ font-family:var(--mono); font-size:var(--t-xs); color:var(--muted); margin-left:var(--s2); }

/* --- sessions ----------------------------------------------------------- */
.sessions{ list-style:none; padding:0; margin:0; }
.session{ border-top:1px solid var(--rule); padding:var(--s4) var(--s2);
  display:grid; grid-template-columns:92px 1fr; gap:var(--s4); }
.session:last-child{ border-bottom:1px solid var(--rule); }
.session .meta{ font-family:var(--mono); font-size:var(--t-xs); color:var(--muted); }
.session .meta b{ display:block; color:var(--graphite); font-size:var(--t-sm); font-weight:500; }
.session h3{ font-family:var(--body); font-weight:600; font-size:var(--t-base); margin:0 0 var(--s2); }
.session p{ margin:0 0 var(--s3); font-size:var(--t-sm); }
.moves{ font-family:var(--mono); font-size:var(--t-xs); color:var(--muted); }
.moves span{ white-space:nowrap; margin-right:var(--s3); display:inline-block; }
.moves b{ color:var(--graphite); font-weight:500; }

/* --- states ------------------------------------------------------------- */
.state-box{ background:var(--panel); border-left:3px solid var(--graphite); padding:var(--s5); }
.state-box.bad{ border-left-color:var(--spec); }
.state-box h3{ font-family:var(--display); font-size:var(--t-lg); margin:0 0 var(--s2); }
.state-box p{ margin:0 0 var(--s3); font-size:var(--t-sm); }
.state-box p:last-child{ margin-bottom:0; }
.state-box code{ font-family:var(--mono); font-size:var(--t-xs); background:var(--paper);
  padding:2px 5px; border:1px solid var(--rule); }

.gaplist{ margin:0; padding-left:var(--s5); font-size:var(--t-sm); color:var(--muted); }
.gaplist li{ margin-bottom:var(--s2); }

footer{ border-top:2px solid var(--graphite); margin-top:var(--s8); padding-top:var(--s4);
  font-family:var(--mono); font-size:var(--t-xs); color:var(--muted); letter-spacing:.06em; }

/* --- narrow ------------------------------------------------------------- */
@media (max-width:560px){
  .wrap{ padding:var(--s5) var(--s3) var(--s8); }
  summary.block-head{ grid-template-columns:1fr auto; gap:var(--s3) var(--s4); }
  summary.block-head > :nth-child(1){ grid-area:1/1/2/2; }
  summary.block-head > :nth-child(2){ grid-area:2/1/3/3; }
  summary.block-head > :nth-child(3){ grid-area:1/2/2/3; justify-self:end; }
  .session{ grid-template-columns:1fr; gap:var(--s2); }
  .unit{ grid-template-columns:66px 1fr; }
  .unit .pips{ grid-column:2; }
}
@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>
</head>

<body>
<main class="wrap">

  <header class="mast">
    <div>
      <h1>Fast Track</h1>
      <p class="sub">SSDSI Lean Six Sigma Black Belt</p>
    </div>
    <p class="count"><a href="glossary.html" class="navlink">Glossary &rarr;</a> &nbsp; <span id="mast-count"></span></p>
  </header>

  <div id="app"></div>

  <footer>
    Scores are assigned during debrief, not self-reported. 0 untouched &middot; 1 watched &middot; 2 explained &middot; 3 applied.
  </footer>

</main>

<script src="data/curriculum.js"></script>
<script src="data/log.js"></script>

<script>
(function () {
  var app = document.getElementById('app');

  if (!window.ICBB_CURRICULUM || !window.ICBB_LOG) {
    app.innerHTML = '<div class="state-box bad"><h3>The data files did not load</h3>' +
      '<p>This page needs <code>data/curriculum.js</code> and <code>data/log.js</code> ' +
      'sitting next to it. Check that the <code>data</code> folder came along.</p></div>';
    return;
  }

  var CUR = window.ICBB_CURRICULUM;
  var LOG = window.ICBB_LOG;
  var scores = LOG.scores || {};
  var watched = LOG.watched || [];
  var sessions = LOG.sessions || [];

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function scoreOf(id){ var r = scores[id]; return r && typeof r.s === 'number' ? r.s : 0; }
  function daysSince(iso){ if(!iso) return null;
    return Math.floor((Date.now() - new Date(iso+'T12:00:00').getTime())/86400000); }

  /* --- deadline ---------------------------------------------------------- */
  var dl = CUR.deadline || {};
  function plusDays(iso, d){
    if (!iso) return null;
    var e = new Date(iso + 'T12:00:00');
    e.setDate(e.getDate() + d);
    return e.toISOString().slice(0,10);
  }
  var enrolElapsed = daysSince(dl.enrolmentStart);
  var enrolLeft = (enrolElapsed === null) ? null : dl.days - enrolElapsed;
  var enrolEnd = plusDays(dl.enrolmentStart, dl.days);
  var projStarted = dl.projectStart && daysSince(dl.projectStart) >= 0;
  var projLeft = projStarted ? dl.days - daysSince(dl.projectStart) : null;
  var projEnd = plusDays(dl.projectStart, dl.days);

  var headlineN, headlineCap, urgent = false, hedge = '';
  if (dl.mode === 'enrolment') {
    headlineN = enrolLeft; headlineCap = 'days left · ends ' + enrolEnd;
    urgent = enrolLeft !== null && enrolLeft < 90;
  } else if (dl.mode === 'project') {
    if (projLeft === null) {
      headlineN = dl.days; headlineCap = 'days once the project starts';
    } else {
      headlineN = projLeft; headlineCap = 'days left · ends ' + projEnd;
      urgent = projLeft < 90;
    }
  } else {
    headlineN = '?'; headlineCap = 'days left — start date disputed';
    hedge = 'If the clock runs from enrolment you have <strong>' +
      (enrolLeft === null ? '—' : enrolLeft) + ' days</strong>, ending ' + enrolEnd +
      '. If it runs from passing the exam you have the full <strong>' + dl.days +
      ' days</strong> from that point. Ask SSDSI which.';
  }

  /* --- unit totals ------------------------------------------------------- */
  var allUnits = [];
  CUR.modules.forEach(function(m){ m.units.forEach(function(u){ allUnits.push(u); }); });
  var applied = allUnits.filter(function(u){ return scoreOf(u.id) === 3; }).length;
  var untouched = allUnits.filter(function(u){
    return scoreOf(u.id) === 0 && watched.indexOf(u.id) === -1; }).length;

  document.getElementById('mast-count').textContent =
    sessions.length + (sessions.length === 1 ? ' block logged' : ' blocks logged');

  var nameById = {};
  allUnits.forEach(function(u){ nameById[u.id] = u.name; });

  var html = '';

  /* --- readout ----------------------------------------------------------- */
  html += '<div class="readout">';
  html += '<div class="figure' + (urgent ? ' urgent' : '') + '">' +
    '<span class="n">' + headlineN + '</span>' +
    '<span class="cap">' + headlineCap + '</span>' +
    (dl.confirmed ? '' : '<span class="flag">Unconfirmed — ask SSDSI</span>') +
    '</div>';
  html += '<div class="figure"><span class="n">' + applied + '<small>/' + allUnits.length + '</small></span>' +
    '<span class="cap">units at applied level</span></div>';
  html += '<div class="figure"><span class="n">' + untouched + '</span>' +
    '<span class="cap">units not yet opened</span></div>';
  html += '</div>';

  if (hedge) {
    html += '<div class="state-box bad" style="margin-bottom:var(--s7)">' +
      '<h3>The 180 days start somewhere</h3><p>' + hedge + '</p></div>';
  } else if (!dl.confirmed) {
    html += '<div class="state-box" style="margin-bottom:var(--s6)">' +
      '<h3>This date is inferred, not confirmed</h3>' +
      '<p>' + esc(dl.caveat || '') + '</p>' +
      (dl.extensions ? '<p><strong>' + dl.extensions.available + ' &times; ' +
        dl.extensions.daysEach + '-day extensions</strong> are available for a fee \u2014 up to ' +
        (dl.extensions.available * dl.extensions.daysEach) + ' extra days. ' +
        esc(dl.extensions.note.split('. ').slice(1).join('. ')) + '</p>' : '') +
      '</div>';
  }

  if (CUR.effort) {
    html += '<p class="note" style="margin:calc(-1 * var(--s5)) 0 var(--s7)">' +
      'Course size: ' + Math.round(CUR.effort.videoMinutes / 60 * 10) / 10 + ' hours of video across ' +
      allUnits.length + ' units, plus roughly ' + CUR.effort.projectHours +
      ' hours of project work. The coursework is the small half.</p>';
  }

  /* --- tollgates --------------------------------------------------------- */
  var ms = LOG.milestones || {};
  var gates = [
    { key:'coursework', step:'Gate 1', title:'Coursework', sub: allUnits.length + ' units' },
    { key:'exam', step:'Gate 2', title:'SSDSI exam',
      sub: CUR.exam.questions + ' questions · ' + CUR.exam.minutes + ' min · ' +
           CUR.exam.passMark + '% to pass · ' + CUR.exam.attempts + ' attempts' },
    { key:'project', step:'Gate 3', title:'Black Belt project',
      sub: CUR.project.workbook + (CUR.project.estimatedHours ? ' · ~' + CUR.project.estimatedHours + ' hours · solo' : '') }
  ];
  html += '<section><h2>Tollgates</h2><div class="gates">';
  gates.forEach(function(g){
    var st = (ms[g.key] && ms[g.key].status) || 'todo';
    var label = st === 'done' ? 'Complete' : st === 'active' ? 'In progress' : 'Locked';
    html += '<div class="gate ' + st + '">' +
      '<span class="step">' + g.step + '</span>' +
      '<h3>' + esc(g.title) + '</h3>' +
      '<p>' + esc(g.sub) + '</p>' +
      '<span class="state">' + label + (ms[g.key] && ms[g.key].note ? ' — ' + esc(ms[g.key].note) : '') + '</span>' +
      '</div>';
  });
  html += '</div>';
  if (CUR.project && CUR.project.hardRequirements) {
    html += '<p class="note" style="margin-top:var(--s4)"><strong>Gate 3 will not pass without these:</strong></p>' +
      '<ul class="gaplist">' + CUR.project.hardRequirements.map(function(r){
        return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
    if (CUR.project.submission) {
      html += '<p class="note">' + esc(CUR.project.submission) + '</p>';
    }
  }
  html += '</section>';
  var plan = LOG.plan || {};
  var due = Object.keys(scores).filter(function(id){
    var r = scores[id], d = daysSince(r.last);
    return r.s > 0 && r.s < 3 && d !== null && d >= 10; });

  html += '<section><h2>Next block</h2><div class="nextup">';
  html += '<p>' + esc(plan.note || 'No plan set yet.') + '</p>';
  if (plan.nextUp && plan.nextUp.length) {
    html += '<ul class="chips">' + plan.nextUp.map(function(id){
      return '<li class="chip">' + esc(id) + ' &nbsp;' + esc(nameById[id] || 'unknown unit') + '</li>';
    }).join('') + '</ul>';
  }
  if (due.length) {
    html += '<p class="note" style="margin:var(--s4) 0 var(--s2)">Stalled below applied level for 10 days or more:</p>';
    html += '<ul class="chips">' + due.map(function(id){
      return '<li class="chip due">' + esc(id) + ' &nbsp;' + esc(nameById[id] || '') + '</li>';
    }).join('') + '</ul>';
  }
  html += '</div></section>';

  /* --- control chart ----------------------------------------------------- */
  html += '<section><h2>Individuals chart — units reaching applied level per block</h2>';
  html += '<div class="chart-frame">' + buildChart(sessions) + '</div>';
  html += '<p class="chart-legend">An <strong>I-chart</strong>, the individuals control chart from ' +
    'Module 15. Centre line is your mean. Limits are CL &plusmn; 2.66 &times; average moving range. ' +
    'A point outside them is a special cause — an unusually strong or unusually poor block. ' +
    'Ask what was different about it.</p></section>';

  /* --- units ------------------------------------------------------------- */
  html += '<section><h2>Course units</h2>';
  CUR.modules.forEach(function(m){
    var c = [0,0,0,0];
    m.units.forEach(function(u){ c[scoreOf(u.id)]++; });
    var n = m.units.length;
    var pct = function(x){ return (x/n*100).toFixed(2) + '%'; };
    var open = m.units.some(function(u){ return (plan.nextUp||[]).indexOf(u.id) > -1; }) ? ' open' : '';

    html += '<details class="block"' + open + '><summary class="block-head">';
    html += '<span><span class="block-name">' + esc(m.name) + '</span>' +
      '<span class="block-sub">' + esc(m.subtitle) + '</span></span>';
    html += '<span class="dist" role="img" aria-label="' + c[3] + ' applied, ' + c[2] +
      ' explained, ' + c[1] + ' watched, ' + c[0] + ' untouched">' +
      '<span class="l3" style="width:' + pct(c[3]) + '"></span>' +
      '<span class="l2" style="width:' + pct(c[2]) + '"></span>' +
      '<span class="l1" style="width:' + pct(c[1]) + '"></span></span>';
    html += '<span class="block-tally">' + c[3] + '/' + n + '</span></summary><ul class="units">';

    m.units.forEach(function(u){
      var s = scoreOf(u.id);
      var rec = scores[u.id];
      var d = rec ? daysSince(rec.last) : null;
      var stale = s > 0 && s < 3 && d !== null && d >= 10;
      var seen = watched.indexOf(u.id) > -1;
      html += '<li class="unit' + (s === 3 ? ' done' : '') + '">' +
        '<span class="uid">' + esc(u.id) + '</span>' +
        '<span class="uname">' + esc(u.name) +
          (u.project ? '<span class="tag proj">project tool</span>' : '') +
          (seen && s === 0 ? '<span class="tag">watched</span>' : '') +
          (stale ? '<span class="tag" style="border-color:var(--spec);color:var(--spec)">stalled</span>' : '') +
        '</span>' +
        '<span class="pips" role="img" aria-label="Score ' + s + ' of 3">' +
          '<i class="' + (s>=1?'on':'') + '"></i>' +
          '<i class="' + (s>=2?'on':'') + '"></i>' +
          '<i class="' + (s>=3?'on':'') + '"></i>' +
          '<span class="sr">' + (CUR.scale[s] ? CUR.scale[s].label.toLowerCase() : '') + '</span>' +
        '</span>' +
        (u.flag ? '<span class="unit-flag">' + esc(u.flag) + '</span>' : '') +
        (u.alt ? '<span class="unit-alt">' + esc(u.alt) + '</span>' : '') +
        '</li>';
    });
    html += '</ul></details>';
  });
  html += '</section>';

  /* --- sessions ---------------------------------------------------------- */
  html += '<section><h2>Blocks</h2>';
  if (!sessions.length) {
    html += '<div class="state-box"><h3>No blocks yet</h3>' +
      '<p>Study for an hour, then open Claude Code in this folder and say ' +
      '<code>debrief me</code>. It will ask what you covered, quiz you, score each unit, ' +
      'and write the block here.</p></div>';
  } else {
    html += '<ul class="sessions">';
    sessions.slice().reverse().forEach(function(s){
      html += '<li class="session">' +
        '<span class="meta"><b>Block ' + esc(s.n) + '</b>' + esc(s.date) +
        (s.minutes ? '<br>' + esc(s.minutes) + ' min' : '') + '</span><div>' +
        '<h3>' + esc(s.title || 'Untitled block') + '</h3>' +
        (s.notes ? '<p>' + esc(s.notes) + '</p>' : '') +
        (s.units && s.units.length ? '<p class="moves">' + s.units.map(function(t){
          return '<span><b>' + esc(t.id) + '</b> ' + t.from + '&rarr;' + t.to + '</span>';
        }).join('') + '</p>' : '') + '</div></li>';
    });
    html += '</ul>';
  }
  html += '</section>';

  /* --- IASSC gap --------------------------------------------------------- */
  if (CUR.iasscGap && CUR.iasscGap.length) {
    html += '<section><h2>Not covered by this course</h2>' +
      '<details class="block"><summary class="block-head">' +
      '<span><span class="block-name">IASSC gap</span>' +
      '<span class="block-sub">Only relevant if you later sit the IASSC exam</span></span>' +
      '<span></span><span class="block-tally">' + CUR.iasscGap.length + ' areas</span></summary>' +
      '<ul class="gaplist" style="padding-bottom:var(--s4)">' +
      CUR.iasscGap.map(function(g){ return '<li>' + esc(g) + '</li>'; }).join('') +
      '</ul></details></section>';
  }

  app.innerHTML = html;

  /* ======================================================================== */
  function buildChart(list){
    if (list.length < 2) {
      return '<div class="state-box" style="background:var(--paper)">' +
        '<h3>' + (list.length === 0 ? 'Baseline not started' : 'One point is not a process') + '</h3>' +
        '<p>Control limits need a moving range, which needs at least two blocks. Log ' +
        (2 - list.length) + ' more and the chart draws itself.</p></div>';
    }
    var vals = list.map(function(s){
      return (s.units || []).filter(function(t){ return t.to === 3 && t.from < 3; }).length; });
    var n = vals.length;
    var cl = vals.reduce(function(a,b){return a+b;},0)/n;
    var mr = [];
    for (var i=1;i<n;i++) mr.push(Math.abs(vals[i]-vals[i-1]));
    var mrbar = mr.reduce(function(a,b){return a+b;},0)/mr.length;
    var ucl = cl + 2.66*mrbar, lcl = Math.max(0, cl - 2.66*mrbar);

    var W=900,H=340,PL=54,PR=22,PT=24,PB=46;
    var top = Math.max(ucl, Math.max.apply(null,vals))*1.15 + 1;
    var x=function(i){ return PL + (n===1?0:i*(W-PL-PR)/(n-1)); };
    var y=function(v){ return PT + (H-PT-PB)*(1-v/top); };

    var g = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Control chart of units mastered per block. Centre line '+cl.toFixed(1)+', upper limit '+ucl.toFixed(1)+'.">';
    g += '<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(H-PB)+'" stroke="var(--graphite)" stroke-width="1.5"/>';
    g += '<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'" stroke="var(--graphite)" stroke-width="1.5"/>';

    function limit(v,label,colour,dash){
      g += '<line x1="'+PL+'" y1="'+y(v)+'" x2="'+(W-PR)+'" y2="'+y(v)+'" stroke="'+colour+
           '" stroke-width="1.25"'+(dash?' stroke-dasharray="7 5"':'')+'/>';
      g += '<text x="'+(PL-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="12" fill="'+colour+'">'+label+'</text>';
    }
    limit(ucl,'UCL','var(--spec)',true);
    limit(cl,'CL','var(--graphite)',false);
    if (lcl > 0) limit(lcl,'LCL','var(--spec)',true);

    g += '<path d="'+vals.map(function(v,i){return (i?'L':'M')+x(i)+' '+y(v);}).join(' ')+'" fill="none" stroke="var(--graphite)" stroke-width="1.5"/>';
    vals.forEach(function(v,i){
      var out = v>ucl || v<lcl;
      g += '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+(out?6.5:4.5)+'" fill="'+(out?'var(--spec)':'var(--graphite)')+'"/>';
      if (out) g += '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="11" fill="none" stroke="var(--spec)" stroke-width="1.25"/>';
      g += '<text x="'+x(i)+'" y="'+(H-PB+20)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--muted)">'+list[i].n+'</text>';
    });
    g += '<text x="'+(PL+(W-PL-PR)/2)+'" y="'+(H-8)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--muted)" letter-spacing="1.5">BLOCK</text></svg>';
    return g;
  }
})();
</script>
</body>
</html>
